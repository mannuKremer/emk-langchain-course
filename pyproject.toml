[project]
name = "emk-langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mannukremer", email = "mannukremer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.8",
    "langchain-anthropic>=1.7.9",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
emk-langchain-course = "emk_langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
